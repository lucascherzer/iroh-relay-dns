name: update

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-hash even if version has not changed"
        type: boolean
        default: false

jobs:
  update:
    name: Check for new iroh release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install Nushell
        run: nix profile install nixpkgs#nushell

      - name: Run update script
        id: update
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          nu .github/workflows/update-hashes.nu $ARGS

          # Detect whether files changed
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            NEW_VERSION=$(jq -r '.version' hashes.json)
            echo "changed=true"      >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "update/iroh-v${{ steps.update.outputs.version }}"
          commit-message: "chore: update iroh to v${{ steps.update.outputs.version }}"
          title: "chore: update iroh to v${{ steps.update.outputs.version }}"
          body: |
            Automated update of iroh packages to **v${{ steps.update.outputs.version }}**.

            - Updated `hashes.json` with new SRI hashes for all platforms

            Generated by the [update workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: "dependencies,automated"
          delete-branch: true
